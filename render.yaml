# Render Blueprint — one-click deploy from GitHub.
# 1. Push this repo to GitHub
# 2. Render > New > Blueprint > connect this repo > Apply
#
# Creates an always-free web service running the auth + progress backend.

services:
  - type: web
    name: ssc-quiz-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.mjs
    plan: free
    envVars:
      # Keep sessions valid across restarts (data files are ephemeral on free tier).
      - key: JWT_SECRET
        generateValue: true
      # OTP email verification requires real SMTP credentials. Add these values
      # in Render > ssc-quiz-server > Environment (then redeploy):
      #   SMTP_HOST=smtp.gmail.com
      #   SMTP_PORT=465
      #   SMTP_USER=your@gmail.com            (or an app-specific address)
      #   SMTP_PASS=your-app-password        (Gmail: App Passwords, not your login password)
      #   MAIL_FROM=SSC Quiz Prep <your@gmail.com>
      # Until SMTP is configured, the app can work with in-app OTP by adding:
      #   DEV_OTP_MODE=true
      # (off by default; the OTP is returned in the API response and shown in-app).
      # With both unset and no SMTP, registration is disabled for safety.
      - key: DEV_OTP_MODE
        value: 'true'
    healthCheckPath: /api/health